on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        coq_version: ['latest']
        ocaml_version: ['default']
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
    - uses: coq-community/docker-coq-action@v1
      with:
        opam_file: 'xhl.opam'
        coq_version: ${{ matrix.coq_version }}
        ocaml_version: ${{ matrix.ocaml_version }}
